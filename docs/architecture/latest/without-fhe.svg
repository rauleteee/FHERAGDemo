<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#EF4444"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="#FFFFFF"/>

  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#B91C1C">Normal search — the server can read your data</text>
  <text x="600" y="86" text-anchor="middle" font-size="17" fill="#64748B">You send your question and documents as plain text. Whoever runs the server can see all of it.</text>

  <!-- Arrow -->
  <line x1="360" y1="270" x2="840" y2="270" stroke="#EF4444" stroke-width="8" marker-end="url(#ah)"/>

  <!-- Traveling data: readable letter -->
  <g filter="url(#sh)">
    <rect x="530" y="150" width="140" height="104" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="3.5"/>
  </g>
  <g fill="#334155">
    <rect x="552" y="172" width="96" height="9" rx="4"/>
    <rect x="552" y="192" width="76" height="9" rx="4"/>
    <rect x="552" y="212" width="88" height="9" rx="4"/>
    <rect x="552" y="232" width="58" height="9" rx="4"/>
  </g>
  <text x="600" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#B91C1C">your data — anyone can read it</text>

  <!-- YOU (laptop) -->
  <g filter="url(#sh)" transform="translate(210,260)">
    <rect x="-58" y="-44" width="116" height="76" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <rect x="-48" y="-34" width="96" height="56" rx="4" fill="#E8F4FD"/>
    <path d="M-74 36 L74 36 L60 50 L-60 50 Z" fill="#CBD5E1" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="210" y="360" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">You</text>
  <text x="210" y="386" text-anchor="middle" font-size="15" fill="#64748B">your computer</text>

  <!-- SERVER -->
  <g filter="url(#sh)" transform="translate(985,260)">
    <rect x="-54" y="-60" width="108" height="120" rx="11" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <rect x="-42" y="-48" width="84" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="-42" y="-13" width="84" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="-42" y="22" width="84" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="30" cy="-33" r="4" fill="#94A3B8"/><circle cx="30" cy="2" r="4" fill="#94A3B8"/><circle cx="30" cy="37" r="4" fill="#94A3B8"/>
  </g>
  <text x="985" y="360" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">The server</text>
  <text x="985" y="386" text-anchor="middle" font-size="15" fill="#64748B">someone else's computer</text>

  <!-- Eye badge: server can read -->
  <g filter="url(#sh)" transform="translate(1052,204)">
    <circle r="36" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
    <path d="M-21 0 Q0 -16 21 0 Q0 16 -21 0 Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
    <circle r="7.5" fill="#DC2626"/>
  </g>

  <!-- Banner -->
  <rect x="150" y="418" width="900" height="60" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="600" y="455" text-anchor="middle" font-size="19" font-weight="700" fill="#B91C1C">⚠  The server sees everything — your question and your private documents are exposed.</text>
</svg>
