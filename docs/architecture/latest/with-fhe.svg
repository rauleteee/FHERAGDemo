<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahg" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#16A34A"/></marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/></filter>
  </defs>

  <rect width="1200" height="560" fill="#FFFFFF"/>

  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#15803D">Search with FHE — the server never sees your data</text>
  <text x="600" y="82" text-anchor="middle" font-size="17" fill="#64748B">You lock everything with your key first. The agent searches the locked database, and the server can never open any of it.</text>

  <!-- Zones -->
  <rect x="55" y="150" width="625" height="230" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="78" y="178" font-size="13" font-weight="700" letter-spacing="1" fill="#475569">🖥  YOUR COMPUTER</text>
  <rect x="770" y="150" width="375" height="230" rx="16" fill="#EFFdf4" stroke="#22C55E" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="793" y="178" font-size="13" font-weight="700" letter-spacing="1" fill="#15803D">☁  THE SERVER (someone else's computer)</text>

  <!-- Arrows forward -->
  <line x1="212" y1="255" x2="422" y2="255" stroke="#16A34A" stroke-width="7" marker-end="url(#ahg)"/>
  <line x1="518" y1="255" x2="905" y2="255" stroke="#16A34A" stroke-width="7" marker-end="url(#ahg)"/>
  <text x="317" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">① asks a question</text>
  <text x="600" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">② searches the knowledge base</text>

  <!-- Traveling data: locked box -->
  <g filter="url(#sh2)" transform="translate(725,255)">
    <rect x="-46" y="-32" width="92" height="64" rx="8" fill="#ECFDF3" stroke="#16A34A" stroke-width="3"/>
    <path d="M-15 -3 v-9 a15 15 0 0 1 30 0 v9" fill="none" stroke="#15803D" stroke-width="5"/>
    <rect x="-21" y="-3" width="42" height="30" rx="6" fill="#22C55E" stroke="#15803D" stroke-width="2.5"/>
    <circle cx="0" cy="10" r="4.5" fill="#FFFFFF"/>
    <rect x="-2" y="10" width="4" height="11" rx="2" fill="#FFFFFF"/>
  </g>
  <text x="725" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#15803D">locked — nobody can read it</text>

  <!-- Return path -->
  <path d="M960 305 L960 445 L170 445 L170 305" fill="none" stroke="#16A34A" stroke-width="6" stroke-linejoin="round" marker-end="url(#ahg)"/>
  <text x="565" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">③ the answer comes back still locked — only your key can open it</text>

  <!-- Person -->
  <g filter="url(#sh2)" transform="translate(170,250)">
    <circle cx="0" cy="-24" r="20" fill="#E8F4FD" stroke="#334155" stroke-width="4"/>
    <path d="M-32 40 a32 32 0 0 1 64 0 Z" fill="#E8F4FD" stroke="#334155" stroke-width="4"/>
  </g>
  <text x="170" y="330" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">You</text>

  <!-- Key badge: only you have it -->
  <g filter="url(#sh2)" transform="translate(255,205)">
    <circle r="30" fill="#FEF9C3" stroke="#F59E0B" stroke-width="3"/>
    <g transform="translate(-6,0)">
      <circle cx="-8" cy="0" r="10" fill="none" stroke="#D97706" stroke-width="6"/>
      <rect x="0" y="-3.5" width="28" height="7" rx="2" fill="#D97706"/>
      <rect x="22" y="3" width="5" height="10" rx="2" fill="#D97706"/>
      <rect x="12" y="3" width="5" height="10" rx="2" fill="#D97706"/>
    </g>
  </g>
  <text x="255" y="162" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B45309">your secret key</text>

  <!-- Agent robot -->
  <g filter="url(#sh2)" transform="translate(470,252)">
    <line x1="0" y1="-52" x2="0" y2="-38" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-56" r="5" fill="#7B68EE"/>
    <rect x="-40" y="-38" width="80" height="66" rx="14" fill="#F0EDFF" stroke="#7B68EE" stroke-width="4"/>
    <circle cx="-15" cy="-8" r="7" fill="#5B4ACF"/>
    <circle cx="15" cy="-8" r="7" fill="#5B4ACF"/>
    <rect x="-18" y="10" width="36" height="6" rx="3" fill="#5B4ACF"/>
  </g>
  <text x="470" y="330" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">Your agent</text>
  <text x="470" y="352" text-anchor="middle" font-size="13.5" fill="#64748B">the AI assistant</text>

  <!-- Knowledge database (locked) -->
  <g filter="url(#sh2)" transform="translate(960,250)">
    <path d="M-46 -30 v60 a46 15 0 0 0 92 0 v-60 Z" fill="#FFF4EC" stroke="#FF8C42" stroke-width="4"/>
    <ellipse cx="0" cy="-30" rx="46" ry="15" fill="#FFE7D0" stroke="#FF8C42" stroke-width="4"/>
    <path d="M-46 -8 a46 15 0 0 0 92 0" fill="none" stroke="#FF8C42" stroke-width="3"/>
    <path d="M-46 12 a46 15 0 0 0 92 0" fill="none" stroke="#FF8C42" stroke-width="3"/>
    <!-- padlock overlay -->
    <path d="M-13 8 v-8 a13 13 0 0 1 26 0 v8" fill="none" stroke="#15803D" stroke-width="5"/>
    <rect x="-19" y="8" width="38" height="28" rx="6" fill="#22C55E" stroke="#15803D" stroke-width="2.5"/>
    <circle cx="0" cy="20" r="4" fill="#FFFFFF"/>
    <rect x="-2" y="20" width="4" height="10" rx="2" fill="#FFFFFF"/>
  </g>
  <text x="960" y="330" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">Knowledge database</text>
  <text x="960" y="352" text-anchor="middle" font-size="13.5" fill="#64748B">documents kept locked</text>

  <!-- Eye badge crossed out: server can't read -->
  <g filter="url(#sh2)" transform="translate(1102,196)">
    <circle r="32" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/>
    <path d="M-19 0 Q0 -14 19 0 Q0 14 -19 0 Z" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/>
    <circle r="6.5" fill="#16A34A"/>
    <line x1="-24" y1="-20" x2="24" y2="20" stroke="#16A34A" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- Banner -->
  <rect x="110" y="498" width="980" height="52" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="600" y="531" text-anchor="middle" font-size="18.5" font-weight="700" fill="#15803D">✅  Only you hold the key. The agent searches the locked database and the server never sees what it is.</text>
</svg>
