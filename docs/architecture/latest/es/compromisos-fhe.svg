<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="DejaVu Sans, sans-serif">
  <rect width="1200" height="820" fill="#FFFFFF"/>
  <text x="600.0" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#15172A">Usar FHE en el servidor: ventajas y costes</text>
  <text x="600.0" y="82" text-anchor="middle" font-size="16" fill="#5C6178">Búsqueda vectorial cifrada para RAG — lo que ganas y lo que pagas.</text>

  <rect x="60" y="100" width="1080" height="74" rx="14" fill="#F0EDFF" stroke="#5B4ACF" stroke-width="1.5"/>
  <g transform="translate(112,137)">
    <rect x="-26" y="-25" width="52" height="50" rx="7" fill="#FFFFFF" stroke="#5B4ACF" stroke-width="2.5"/>
    <line x1="-16" y1="-13" x2="16" y2="-13" stroke="#5B4ACF" stroke-width="2"/>
    <g transform="translate(0,9)"><path d="M-15 -7 v14 a15 5 0 0 0 30 0 v-14 Z" fill="#EFE9FF" stroke="#5B4ACF" stroke-width="2"/>
      <ellipse cx="0" cy="-7" rx="15" ry="5" fill="#E4DBFF" stroke="#5B4ACF" stroke-width="2"/></g>
  </g>
  <text x="162" y="132" font-size="17" font-weight="700" fill="#5B4ACF">Tu base de conocimiento vive en un servidor que no controlas.</text>
  <text x="162" y="156" font-size="15" fill="#6D5FCB">Por eso el cifrado importa: alguien más aloja tus vectores.</text>

  <rect x="60" y="192" width="530" height="548" rx="18" fill="#ECF7F0" stroke="#12A150" stroke-width="2"/>
  <rect x="610" y="192" width="530" height="548" rx="18" fill="#FDF4E5" stroke="#D98200" stroke-width="2"/>
  <text x="90" y="234" font-size="18" font-weight="800" fill="#12A150" letter-spacing="0.5">LO QUE GANAS</text>
  <text x="640" y="234" font-size="18" font-weight="800" fill="#D98200" letter-spacing="0.5">LO QUE CUESTA</text>

  <circle cx="112" cy="300" r="22" fill="#12A150" fill-opacity="0.14"/><path d="M100 300 Q112 292 124 300 Q112 308 100 300 Z" fill="none" stroke="#12A150" stroke-width="2.2"/><circle cx="112" cy="300" r="3" fill="#12A150"/><line x1="98" y1="288" x2="126" y2="312" stroke="#12A150" stroke-width="2.6" stroke-linecap="round"/><text x="150" y="296" font-size="20" font-weight="700" fill="#15172A">El servidor nunca ve tus datos</text><text x="150" y="319" font-size="14.5" fill="#5C6178">tu pregunta y tus documentos van cifrados</text>
  <circle cx="112" cy="470" r="22" fill="#12A150" fill-opacity="0.14"/><g transform="translate(112,470)">
      <path d="M0 -13 L12 -8 V2 Q12 11 0 15 Q-12 11 -12 2 V-8 Z" fill="#12A150" fill-opacity="0.18" stroke="#12A150" stroke-width="2"/>
      <path d="M-5 0 l3.5 4 l6.5 -8" fill="none" stroke="#12A150" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150" y="466" font-size="20" font-weight="700" fill="#15172A">Nadie reconstruye tus textos</text><text x="150" y="489" font-size="14.5" fill="#5C6178">los números cifrados no se pueden volver a leer</text>
  <circle cx="112" cy="620" r="22" fill="#12A150" fill-opacity="0.14"/><g transform="translate(112,620)">
      <rect x="-12" y="-2" width="24" height="16" rx="3" fill="none" stroke="#12A150" stroke-width="2"/>
      <line x1="-7" y1="4" x2="7" y2="4" stroke="#12A150" stroke-width="1.8"/><line x1="-7" y1="9" x2="7" y2="9" stroke="#12A150" stroke-width="1.8"/>
      <path d="M-6 -3 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#12A150" stroke-width="2"/></g><text x="150" y="616" font-size="20" font-weight="700" fill="#15172A">No hace falta fiarse del servidor</text><text x="150" y="639" font-size="14.5" fill="#5C6178">la privacidad aguanta aunque no sea de confianza</text>

  <circle cx="660" cy="296" r="22" fill="#D98200" fill-opacity="0.14"/><rect x="646" y="297" width="10" height="10" rx="2" fill="none" stroke="#D98200" stroke-width="2"/><rect x="659" y="284" width="16" height="23" rx="2" fill="#D98200" fill-opacity="0.18" stroke="#D98200" stroke-width="2"/>
  <text x="700" y="292" font-size="20" font-weight="700" fill="#15172A">Más grande y más pesado</text>
  <text x="700" y="315" font-size="14.5" fill="#5C6178">lo cifrado ocupa mucho más espacio</text>
  <text x="700" y="352" font-size="13" fill="#0D9488" font-weight="600">normal</text>
  <rect x="775" y="342" width="55" height="15" rx="3" fill="#0D9488"/>
  <text x="840" y="354" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#5C6178">3 KB</text>
  <text x="700" y="384" font-size="13" fill="#D98200" font-weight="600">cifrado</text>
  <rect x="775" y="374" width="238" height="15" rx="3" fill="#D98200"/>
  <text x="1023" y="386" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#5C6178">~330 KB</text>
  <text x="775" y="414" font-size="13" font-weight="800" fill="#D98200">≈ 100 veces más grande</text>

  <circle cx="660" cy="490" r="22" fill="#D98200" fill-opacity="0.14"/><circle cx="660" cy="490" r="12" fill="none" stroke="#D98200" stroke-width="2.2"/><line x1="660" y1="490" x2="660" y2="482" stroke="#D98200" stroke-width="2.2" stroke-linecap="round"/><line x1="660" y1="490" x2="666" y2="493" stroke="#D98200" stroke-width="2.2" stroke-linecap="round"/><text x="700" y="486" font-size="20" font-weight="700" fill="#15172A">Cada vez más lento</text><text x="700" y="509" font-size="14.5" fill="#5C6178">los revisa uno por uno al buscar</text>
  <g transform="translate(1088,486)"><rect x="-18" y="-16" width="20" height="26" rx="3" fill="#FFFFFF" stroke="#D98200" stroke-width="1.8"/><rect x="-6" y="-14" width="20" height="26" rx="3" fill="#FFFFFF" stroke="#D98200" stroke-width="1.8"/><rect x="6" y="-12" width="20" height="26" rx="3" fill="#FFFFFF" stroke="#D98200" stroke-width="1.8"/><circle cx="14" cy="10" r="9" fill="#FFFFFF" fill-opacity="0.9" stroke="#D98200" stroke-width="2.4"/><line x1="20" y1="16" x2="27" y2="23" stroke="#D98200" stroke-width="2.6" stroke-linecap="round"/></g>
  <circle cx="660" cy="632" r="22" fill="#D98200" fill-opacity="0.14"/><g transform="translate(656,632)">
      <circle cx="-7" cy="0" r="7" fill="none" stroke="#D98200" stroke-width="2.6"/>
      <rect x="-1" y="-1.6" width="18" height="3.4" rx="1.5" fill="#D98200"/>
      <rect x="14" y="1" width="3" height="7" rx="1.2" fill="#D98200"/>
      <rect x="9" y="1" width="3" height="5" rx="1.2" fill="#D98200"/></g><text x="700" y="628" font-size="20" font-weight="700" fill="#15172A">Preparación pesada</text><text x="700" y="651" font-size="14.5" fill="#5C6178">el contexto público que se envía ocupa ~35 MB (una vez)</text>

  <rect x="210.0" y="756" width="780" height="48" rx="24" fill="#F0EDFF" stroke="#5B4ACF" stroke-width="1.5"/>
  <text x="600.0" y="786" text-anchor="middle" font-size="16.5" font-weight="600" fill="#5B4ACF">Merece la pena cuando los datos son sensibles y no tienes millones de documentos.</text>
</svg>