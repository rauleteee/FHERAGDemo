<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#EF4444"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/></filter>
  </defs>

  <rect width="1200" height="560" fill="#FFFFFF"/>

  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#B91C1C">Búsqueda normal — el servidor puede leerlo todo</text>
  <text x="600" y="82" text-anchor="middle" font-size="17" fill="#64748B">Le preguntas a tu agente y busca en la base de datos — pero tus palabras y los documentos viajan como texto legible.</text>

  <!-- Zonas -->
  <rect x="55" y="150" width="625" height="230" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="78" y="178" font-size="13" font-weight="700" letter-spacing="1.5" fill="#475569">TU ORDENADOR</text>
  <rect x="770" y="150" width="375" height="230" rx="16" fill="#FEF3F3" stroke="#EF4444" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="793" y="178" font-size="13" font-weight="700" letter-spacing="1.5" fill="#B91C1C">EL SERVIDOR</text>

  <!-- Flechas de ida -->
  <line x1="212" y1="255" x2="422" y2="255" stroke="#EF4444" stroke-width="7" marker-end="url(#ah)"/>
  <line x1="518" y1="255" x2="905" y2="255" stroke="#EF4444" stroke-width="7" marker-end="url(#ah)"/>
  <text x="317" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">1 · haces una pregunta</text>
  <text x="617" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">2 · busca en la base de datos</text>

  <!-- Dato en tránsito: carta legible -->
  <g filter="url(#sh)" transform="translate(770,255)">
    <rect x="-46" y="-32" width="92" height="64" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="3"/>
    <rect x="-32" y="-18" width="64" height="7" rx="3" fill="#334155"/>
    <rect x="-32" y="-4" width="50" height="7" rx="3" fill="#334155"/>
    <rect x="-32" y="10" width="58" height="7" rx="3" fill="#334155"/>
  </g>
  <text x="770" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">legible — cualquiera puede leerlo</text>

  <!-- Camino de vuelta -->
  <path d="M1006 255 L1100 255 L1100 478 L100 478 L100 255 L140 255" fill="none" stroke="#EF4444" stroke-width="6" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text x="600" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">3 · los documentos vuelven — el servidor los vio todos</text>

  <!-- Persona -->
  <g filter="url(#sh)" transform="translate(170,250)">
    <circle cx="0" cy="-24" r="20" fill="#E8F4FD" stroke="#334155" stroke-width="4"/>
    <path d="M-32 40 a32 32 0 0 1 64 0 Z" fill="#E8F4FD" stroke="#334155" stroke-width="4"/>
  </g>
  <text x="170" y="332" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">Tú</text>

  <!-- Agente robot -->
  <g filter="url(#sh)" transform="translate(470,252)">
    <line x1="0" y1="-52" x2="0" y2="-38" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-56" r="5" fill="#7B68EE"/>
    <rect x="-40" y="-38" width="80" height="66" rx="14" fill="#F0EDFF" stroke="#7B68EE" stroke-width="4"/>
    <circle cx="-15" cy="-8" r="7" fill="#5B4ACF"/>
    <circle cx="15" cy="-8" r="7" fill="#5B4ACF"/>
    <rect x="-18" y="10" width="36" height="6" rx="3" fill="#5B4ACF"/>
  </g>
  <text x="470" y="332" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">Tu agente</text>
  <text x="470" y="354" text-anchor="middle" font-size="13.5" fill="#64748B">el asistente de IA</text>

  <!-- Base de conocimiento -->
  <g filter="url(#sh)" transform="translate(960,250)">
    <path d="M-46 -30 v60 a46 15 0 0 0 92 0 v-60 Z" fill="#FFF4EC" stroke="#FF8C42" stroke-width="4"/>
    <ellipse cx="0" cy="-30" rx="46" ry="15" fill="#FFE7D0" stroke="#FF8C42" stroke-width="4"/>
    <path d="M-46 -8 a46 15 0 0 0 92 0" fill="none" stroke="#FF8C42" stroke-width="3"/>
    <path d="M-46 12 a46 15 0 0 0 92 0" fill="none" stroke="#FF8C42" stroke-width="3"/>
  </g>
  <text x="960" y="332" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">Base de conocimiento</text>
  <text x="960" y="354" text-anchor="middle" font-size="13.5" fill="#64748B">todos los documentos</text>

  <!-- Insignia de ojo: el servidor lee -->
  <g filter="url(#sh)" transform="translate(1102,198)">
    <circle r="30" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
    <path d="M-18 0 Q0 -13 18 0 Q0 13 -18 0 Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
    <circle r="6" fill="#DC2626"/>
  </g>

  <!-- Aviso -->
  <rect x="110" y="500" width="980" height="50" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <path d="M150 513 L165 539 L135 539 Z" fill="#EF4444"/>
  <text x="150" y="536" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF">!</text>
  <text x="600" y="532" text-anchor="middle" font-size="18" font-weight="700" fill="#B91C1C">El servidor ve tu pregunta y todos los documentos. Tus datos privados quedan expuestos.</text>
</svg>
