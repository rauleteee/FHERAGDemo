<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#DC143C"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#F3F5F9"/>
    </linearGradient>
  </defs>

  <rect width="1160" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="46" font-size="27" font-weight="700" fill="#0F172A">FHE-RAG · Encrypted Retrieval Architecture</text>
  <text x="40" y="74" font-size="14.5" fill="#475569">The private key never leaves the client; only ciphertext crosses to the server, which searches the encrypted knowledge base without ever decrypting.</text>

  <!-- ================= GROUP BOXES ================= -->
  <!-- Trusted -->
  <rect x="250" y="175" width="340" height="410" rx="16" fill="#EAF4FD" stroke="#4A90D9" stroke-width="2"/>
  <text x="272" y="202" font-size="13" font-weight="700" letter-spacing="1" fill="#2563EB">🖥  TRUSTED · YOUR MACHINE</text>

  <!-- Untrusted -->
  <rect x="650" y="175" width="470" height="410" rx="16" fill="#FEF3F3" stroke="#DC143C" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="672" y="202" font-size="13" font-weight="700" letter-spacing="1" fill="#B91C1C">☁  UNTRUSTED · SERVER / CLOUD</text>

  <!-- Boundary -->
  <line x1="620" y1="178" x2="620" y2="582" stroke="#DC143C" stroke-width="1.6" stroke-dasharray="3 5" opacity="0.55"/>
  <g transform="translate(626,388)">
    <text transform="rotate(90)" x="0" y="0" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#B91C1C" opacity="0.85">🔒  PUBLIC NETWORK · ONLY CIPHERTEXT CROSSES</text>
  </g>

  <!-- ================= EDGES (behind nodes) ================= -->
  <!-- 1. LLM -> Embed -->
  <path d="M210 360 C245 355 255 300 290 285" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="3.5" fill="#3B82F6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M210 360 C245 355 255 300 290 285"/></circle>
  <!-- 2. Embed -> Search (crosses) -->
  <path d="M550 270 C600 270 645 290 690 292" fill="none" stroke="#3B82F6" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <circle r="4" fill="#3B82F6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M550 270 C600 270 645 290 690 292"/></circle>
  <!-- 3. Knowledge DB -> Search -->
  <path d="M885 430 L885 362" fill="none" stroke="#EA580C" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="3.5" fill="#EA580C"><animateMotion dur="2.6s" repeatCount="indefinite" path="M885 430 L885 362"/></circle>
  <!-- 4. Search -> Decrypt (crosses back) -->
  <path d="M690 338 C625 360 615 500 550 502" fill="none" stroke="#3B82F6" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <circle r="4" fill="#3B82F6"><animateMotion dur="2.4s" repeatCount="indefinite" path="M690 338 C625 360 615 500 550 502"/></circle>
  <!-- 5. Decrypt -> LLM -->
  <path d="M290 515 C250 520 245 465 210 420" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="3.5" fill="#22C55E"><animateMotion dur="2.6s" repeatCount="indefinite" path="M290 515 C250 520 245 465 210 420"/></circle>

  <!-- Private key -> Embed / Decrypt (dashed) -->
  <path d="M420 345 L420 316" fill="none" stroke="#DC143C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <path d="M420 409 L420 469" fill="none" stroke="#DC143C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>

  <!-- ================= EDGE LABELS ================= -->
  <g font-size="11.5" font-weight="600">
    <g><rect x="196" y="300" width="86" height="21" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="239" y="315" text-anchor="middle" fill="#334155">① question</text></g>
    <g><rect x="560" y="228" width="150" height="21" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/><text x="635" y="243" text-anchor="middle" fill="#1D4ED8">② encrypted query 🔒</text></g>
    <g><rect x="896" y="386" width="150" height="21" rx="6" fill="#FFFFFF" stroke="#FED7AA"/><text x="905" y="401" fill="#C2410C">encrypted embeddings</text></g>
    <g><rect x="556" y="452" width="150" height="21" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/><text x="631" y="467" text-anchor="middle" fill="#1D4ED8">③ encrypted scores 🔒</text></g>
    <g><rect x="150" y="452" width="118" height="21" rx="6" fill="#FFFFFF" stroke="#BBF7D0"/><text x="209" y="467" text-anchor="middle" fill="#15803D">④ top-k documents</text></g>
    <text x="432" y="336" font-size="10.5" font-weight="600" fill="#B91C1C">encrypts</text>
    <text x="432" y="446" font-size="10.5" font-weight="600" fill="#B91C1C">decrypts</text>
  </g>

  <!-- ================= NODES ================= -->
  <!-- LLM (purple / api) -->
  <g filter="url(#shadow)">
    <rect x="40" y="335" width="170" height="110" rx="12" fill="#F0EDFF" stroke="#7B68EE" stroke-width="2"/>
  </g>
  <text x="125" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#5B4ACF">🤖  LLM</text>
  <text x="125" y="400" text-anchor="middle" font-size="12" fill="#6D5FCB">needs grounded context</text>
  <text x="125" y="426" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.5" fill="#7B68EE">RAG CONSUMER</text>

  <!-- Embed + Encrypt (green / compute) -->
  <g filter="url(#shadow)">
    <rect x="290" y="225" width="260" height="90" rx="12" fill="#E8FAF0" stroke="#50C878" stroke-width="2"/>
  </g>
  <text x="420" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">Embed + Encrypt query</text>
  <text x="420" y="284" text-anchor="middle" font-size="12" fill="#0F9968">384-dim vector → CKKS ciphertext</text>
  <text x="420" y="305" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.5" fill="#50C878">CLIENT · TENSEAL / SEAL</text>

  <!-- Private key (red / auth) -->
  <g filter="url(#shadow)">
    <rect x="310" y="345" width="220" height="64" rx="12" fill="#FEE2E2" stroke="#DC143C" stroke-width="2"/>
  </g>
  <text x="420" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#B91C1C">🔑  Private key</text>
  <text x="420" y="395" text-anchor="middle" font-size="11.5" fill="#C0374A">never leaves your machine</text>

  <!-- Decrypt + Rank (green / compute) -->
  <g filter="url(#shadow)">
    <rect x="290" y="470" width="260" height="90" rx="12" fill="#E8FAF0" stroke="#50C878" stroke-width="2"/>
  </g>
  <text x="420" y="507" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">Decrypt scores + Rank</text>
  <text x="420" y="529" text-anchor="middle" font-size="12" fill="#0F9968">select top-k relevant documents</text>
  <text x="420" y="550" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.5" fill="#50C878">CLIENT · ONLY HOLDER OF KEY</text>

  <!-- Homomorphic search (green compute, inside untrusted) -->
  <g filter="url(#shadow)">
    <rect x="690" y="250" width="390" height="112" rx="12" fill="#E8FAF0" stroke="#50C878" stroke-width="2"/>
  </g>
  <text x="885" y="290" text-anchor="middle" font-size="16.5" font-weight="700" fill="#059669">Homomorphic similarity search</text>
  <text x="885" y="313" text-anchor="middle" font-size="12.5" fill="#0F9968">dot product computed on ciphertext</text>
  <text x="885" y="340" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#B91C1C">⛔ NO KEY · CANNOT DECRYPT ANYTHING</text>

  <!-- Knowledge DB (orange / database) -->
  <g filter="url(#shadow)">
    <rect x="690" y="430" width="390" height="110" rx="12" fill="#FFF4EC" stroke="#FF8C42" stroke-width="2"/>
  </g>
  <text x="885" y="470" text-anchor="middle" font-size="16.5" font-weight="700" fill="#EA580C">🗄  Knowledge DB</text>
  <text x="885" y="493" text-anchor="middle" font-size="12.5" fill="#C2410C">encrypted embeddings (vector store)</text>
  <text x="885" y="520" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#FF8C42">SERVER · CIPHERTEXT AT REST</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="12" fill="#475569">
    <circle cx="48" cy="632" r="6" fill="#F0EDFF" stroke="#7B68EE" stroke-width="2"/><text x="60" y="636">LLM</text>
    <circle cx="118" cy="632" r="6" fill="#E8FAF0" stroke="#50C878" stroke-width="2"/><text x="130" y="636">Client compute</text>
    <circle cx="238" cy="632" r="6" fill="#FEE2E2" stroke="#DC143C" stroke-width="2"/><text x="250" y="636">Private key</text>
    <circle cx="340" cy="632" r="6" fill="#FFF4EC" stroke="#FF8C42" stroke-width="2"/><text x="352" y="636">Knowledge DB</text>
    <line x1="460" y1="632" x2="488" y2="632" stroke="#3B82F6" stroke-width="2.4"/><text x="496" y="636">ciphertext over the network</text>
  </g>
  <text x="40" y="672" font-size="12.5" font-style="italic" fill="#64748B">Only ciphertext crosses the trust boundary — the server never holds the key and never sees a plaintext embedding, query, or score.</text>
</svg>
